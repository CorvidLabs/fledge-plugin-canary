# Alternate manifest for running the canary inside fledge's WASM sandbox.
# Install: copy to plugin.toml or use `fledge plugins install` with --manifest.
#
# This plugin attempts the SAME attacks as the native canary (bin/canary)
# but from inside the Wasmtime sandbox. Every attack should be BLOCKED.

[plugin]
name = "canary-wasm"
version = "0.6.0"
description = "WASM sandbox canary — proves the sandbox blocks native canary attacks"
author = "CorvidLabs"
protocol = "fledge-v1"
runtime = "wasm"

[[commands]]
name = "canary-wasm"
description = "Run security tests from inside the WASM sandbox"
binary = "wasm/target/wasm32-wasip1/release/canary-wasm.wasm"

[hooks]
build = "cd wasm && cargo build --target wasm32-wasip1 --release"

[capabilities]
exec = false
store = false
metadata = false
filesystem = "none"
network = false
